<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subida</title>
</head>
<body>
    <!-- Formulario para subir archivo con campos de anchura y altura -->
    <form action="404subida.php" method="post" enctype="multipart/form-data">
        <!-- Campo para seleccionar cualquier tipo de archivo -->
        <label for="archivo">Archivo:</label>
        <br><input type="file" name="archivo" id="archivo" required></br>

        <!-- Campo numérico para anchura -->
        <label for="anchura">Anchura</label>
        <br><input type="number" name="anchura" id="anchura" required></br>

        <!-- Campo numérico para altura -->
        <label for="altura">Altura</label>
        <br><input type="number" name="altura" id="altura" required></br>

        <!-- Botón para enviar el formulario -->
        <br><input type="submit" value="Subir"></br>
    </form>
</body>
</html>
